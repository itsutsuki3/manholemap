<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>マンホールカードマップ</title>
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="map" aria-label="地図"></div>

<div id="mode" role="group" aria-label="表示する場所の切り替え">
  <button type="button" data-mode="dist" aria-pressed="true">カード配布場所</button>
  <button type="button" data-mode="lid" aria-pressed="false">蓋の設置場所</button>
</div>

<button id="locate" type="button" aria-label="現在地を表示">
  <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2"/></svg>
</button>

<button id="backup" type="button" aria-label="撮影した写真をZIPでダウンロード" hidden>
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span id="backup-n"></span>
</button>

<div id="toast" role="status" aria-live="polite" hidden></div>

<aside id="sheet" aria-label="詳細" hidden>
  <button id="close" type="button" aria-label="閉じる">✕</button>
  <p id="sample-note" class="note" hidden>動作確認用の架空データです。実在の場所ではありません。</p>
  <div class="head">
    <img id="d-img" alt="" width="84" height="118">
    <div>
      <p id="d-kind" class="kind"></p>
      <h2 id="d-name"></h2>
      <p id="d-meta" class="meta"></p>
    </div>
  </div>
  <p id="d-place" class="place"></p>
  <p id="d-addr" class="meta"></p>
  <label class="check"><input type="checkbox" id="d-check"><span>取得済み</span></label>
  <div class="actions">
    <a id="d-gmaps" class="btn primary" target="_blank" rel="noopener">Google Mapsで経路</a>
    <a id="d-amaps" class="btn" target="_blank" rel="noopener">Apple Maps</a>
    <button id="d-swap" class="btn" type="button"></button>
  </div>
  <div class="actions photo-row">
    <label class="btn" for="d-photo">📷 <span id="photo-label">写真を撮影</span></label>
    <input id="d-photo" type="file" accept="image/*" capture="environment" hidden>
    <button id="d-export" class="btn" type="button" hidden>写真を書き出す</button>
  </div>
  <p id="d-src" class="small"></p>
  <p id="d-status" class="small"></p>
</aside>

<noscript><p style="padding:16px">このサイトの利用にはJavaScriptが必要です。</p></noscript>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/app.js"></script>
</body>
</html>
